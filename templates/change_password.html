{% extends "base.html" %}

{% block content %}
<style>
    .password-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(23, 43, 77, 0.08);
    }

    .password-container h1 {
        color: #172b4d;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .password-subtitle {
        color: #6b778c;
        margin-bottom: 28px;
    }

    .password-form-group {
        margin-bottom: 22px;
    }

    .password-form-group label {
        display: block;
        color: #344563;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .password-form-group input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #dfe1e6;
        border-radius: 9px;
        font-size: 15px;
        box-sizing: border-box;
        outline: none;
    }

    .password-form-group input:focus {
        border-color: #315efb;
    }

    .password-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 28px;
    }

    .password-btn {
        display: inline-block;
        padding: 12px 20px;
        border: none;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
    }

    .password-btn-primary {
        background: #315efb;
        color: white;
    }

    .password-btn-secondary {
        background: #f1f3f8;
        color: #344563;
    }

    .password-message {
        padding: 12px 14px;
        border-radius: 8px;
        margin-bottom: 10px;
        background: #fff0f0;
        color: #b42318;
    }

    .password-message.success {
        background: #e8f7ee;
        color: #18794e;
    }

    @media (max-width: 600px) {
        .password-container {
            margin: 20px 12px;
            padding: 22px;
        }
    }
</style>

<div class="password-container">
    <h1>Change Password</h1>

    <p class="password-subtitle">
        Update your password to keep your account secure.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="password-message {% if message.tags == 'success' %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="password-form-group">
            <label for="current_password">Current Password</label>
            <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="password-form-group">
            <label for="new_password">New Password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="password-form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="password-actions">
            <button
                type="submit"
                class="password-btn password-btn-primary"
            >
                Update Password
            </button>

            <a
                href="{% url 'profile' %}"
                class="password-btn password-btn-secondary"
            >
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
