{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    .edit-profile-container {
        max-width: 650px;
        margin: 40px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(23, 43, 77, 0.08);
    }

    .edit-profile-container h1 {
        color: #172b4d;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .edit-profile-subtitle {
        color: #6b778c;
        margin-bottom: 28px;
    }

    .profile-form-group {
        margin-bottom: 22px;
    }

    .profile-form-group label {
        display: block;
        color: #344563;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .profile-form-group input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #dfe1e6;
        border-radius: 9px;
        font-size: 15px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s;
    }

    .profile-form-group input:focus {
        border-color: #4c7cf0;
    }

    .profile-actions {
        display: flex;
        gap: 12px;
        margin-top: 28px;
        flex-wrap: wrap;
    }

    .profile-btn {
        display: inline-block;
        padding: 12px 20px;
        border: none;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
    }

    .profile-btn-primary {
        background: #315efb;
        color: white;
    }

    .profile-btn-secondary {
        background: #f1f3f8;
        color: #344563;
    }

    .profile-messages {
        margin-bottom: 20px;
    }

    .profile-message {
        padding: 12px 14px;
        border-radius: 8px;
        margin-bottom: 10px;
        background: #fff0f0;
        color: #b42318;
    }

    .profile-message.success {
        background: #e8f7ee;
        color: #18794e;
    }

    @media (max-width: 600px) {
        .edit-profile-container {
            margin: 20px 12px;
            padding: 22px;
        }
    }
</style>

<div class="edit-profile-container">
    <h1>Edit Profile</h1>
    <p class="edit-profile-subtitle">
        Update your account information below.
    </p>

    {% if messages %}
        <div class="profile-messages">
            {% for message in messages %}
                <div class="profile-message {% if message.tags == 'success' %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="profile-form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ request.user.username }}"
                required
                maxlength="150"
            >
        </div>

        <div class="profile-form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ request.user.email }}"
                required
            >
        </div>

        <div class="profile-actions">
            <button type="submit" class="profile-btn profile-btn-primary">
                Save Changes
            </button>

            <a href="{% url 'profile' %}" class="profile-btn profile-btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
